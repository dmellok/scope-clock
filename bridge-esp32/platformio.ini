; Wi-Fi bridge — ESP32-S3 / M5Stack AtomS3U.
[env:atoms3u]
platform  = espressif32
board     = esp32-s3-devkitc-1     ; generic S3 start; swap for an M5 board def if preferred
framework = arduino
; Two phases, and they are not interchangeable: -D defines are ignored unless
; appended PRE, while UPLOADERFLAGS does not exist until the platform builder
; has run, so the OTA target must be set POST.
extra_scripts =
  pre:load_env.py
  post:ota_target.py
build_flags =
  -I ${PROJECT_DIR}/../shared
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1     ; native-USB CDC for the AtomS3U
lib_deps =
  knolleary/PubSubClient           ; MQTT (P3)
monitor_speed = 115200

; Same firmware, flashed over Wi-Fi instead of USB. The bridge lives inside the
; clock's rear USB-A jack, so pulling it out to reflash means the display MCU
; loses its host every time; this avoids that entirely.
;   pio run -e atoms3u_ota -t upload
; Host and password come from .env (OTA_HOST / OTA_PASS) via load_env.py, so no
; credential appears here. The board must have been flashed over USB once first
; — OTA cannot install itself.
[env:atoms3u_ota]
extends        = env:atoms3u
upload_protocol = espota
