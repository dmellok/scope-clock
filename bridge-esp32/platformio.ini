; Wi-Fi bridge — ESP32-S3 / M5Stack AtomS3U.
[env:atoms3u]
platform  = espressif32
board     = esp32-s3-devkitc-1     ; generic S3 start; swap for an M5 board def if preferred
framework = arduino
build_flags =
  -I ${PROJECT_DIR}/../shared
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1     ; native-USB CDC for the AtomS3U
lib_deps =
  knolleary/PubSubClient           ; MQTT (P3)
monitor_speed = 115200
