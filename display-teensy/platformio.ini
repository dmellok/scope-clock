; Display MCU — the thin client. Teensy 3.6 (internal dual DAC).
[env:teensy36]
platform  = teensy
board     = teensy36
framework = arduino
; USBHost_t36 ships with the Teensy core; only external libs listed here.
; (TinyGPS retired in P1 — the bridge does NTP now, so there is no GPS.)
lib_deps  =
; USB role = audio device on the micro-USB, keeping a serial console.
; (equivalent of the Arduino IDE "USB Type" menu; verify name in usb_desc.h)
build_flags =
  -I ${PROJECT_DIR}/../shared
  -D USB_MIDI_AUDIO_SERIAL
monitor_speed = 115200

; `pio run -t upload` does not work out of the box on this board: the stock
; teensy-gui protocol cannot find the hex, and teensy-cli's soft reboot cannot
; find the serial interface once the USB type is MIDI/Audio/Serial. The script
; drives PJRC's own tools in the order that does work — see the comments in it.
upload_protocol = custom
upload_command  = sh ${PROJECT_DIR}/upload_teensy.sh $SOURCE

; To target a 4.1 board (external SPI DAC) copy this env and set board = teensy41.
